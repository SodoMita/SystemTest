name: release

# Release pipeline: pushes player-ready bundles to itch.io
# (https://delatel.itch.io/systemloot) via butler.
#
# Trigger: any push to the `build` branch (release train: merge master ->
# build when a build is wanted), or manual workflow_dispatch.
#
# Channels: windows / osx / linux / android / web
# Auth: repository secret ITCH_API_KEY (itch.io API key), passed to butler
# as BUTLER_API_KEY.
#
# Platform notes (honest ledger):
# - windows/osx: official Luanti release binaries + embedded game.
# - linux: portable bundle (engine + share data + ldd libs + launcher),
#   same technique validated locally against the Debian engine.
# - android: official 5.17 APKs repacked (game injected into the nested
#   assets.zip, re-aligned, debug-signed) — no engine rebuild needed.
# - web: real WASM client built from paradust7/luanti-wasm (emscripten),
#   game embedded in the virtual FS. Network play flows through the
#   standard WebSocket proxies; playing against a dedicated SystemTest
#   server requires hosting one separately.

on:
  push:
    branches: [build]
  workflow_dispatch:

env:
  GAME_ID: SystemTest
  ITCH_TARGET: delatel/systemloot

jobs:
  windows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve latest Luanti release
        run: |
          V=$(curl -s --retry 4 --retry-all-errors --retry-delay 5 https://api.github.com/repos/luanti-org/luanti/releases/latest | jq -r .tag_name 2>/dev/null || true)
          case "$V" in
            ""|null) V="5.17.0"; echo "WARN: latest-release lookup failed (API rate limit?); falling back to pinned $V" ;;
          esac
          echo "LUANTI_VERSION=$V" >> "$GITHUB_ENV"
          echo "Engine version: $V"
      - name: Fetch engine + embed game
        run: |
          set -e
          WORK=$(mktemp -d)
          curl -sL --retry 5 --retry-all-errors --retry-delay 3 -o "$WORK/win.zip" "https://github.com/luanti-org/luanti/releases/download/${LUANTI_VERSION}/luanti-${LUANTI_VERSION}-win64.zip"
          unzip -q "$WORK/win.zip" -d "$WORK/win"
          ROOT=$(find "$WORK/win" -maxdepth 1 -mindepth 1 -type d | head -1)
          mkdir -p "$ROOT/games/$GAME_ID"
          rsync -a --exclude=.git --exclude=.github ./ "$ROOT/games/$GAME_ID/"
          (cd "$WORK/win" && zip -qr "$WORK/SystemLoot-Windows.zip" .)
          cp "$WORK/SystemLoot-Windows.zip" SystemLoot-Windows.zip
          ls -la SystemLoot-Windows.zip
      - name: Install butler
        run: |
          curl -sL --retry 5 --retry-all-errors --retry-delay 3 -o butler.zip https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip
          unzip -q butler.zip
          chmod +x linux-amd64/butler
          ./linux-amd64/butler -V
      - name: Push to itch (windows)
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: ./linux-amd64/butler push SystemLoot-Windows.zip "$ITCH_TARGET:windows" --userversion "${LUANTI_VERSION}-${GITHUB_SHA::7}"

  macos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve latest Luanti release
        run: |
          V=$(curl -s --retry 4 --retry-all-errors --retry-delay 5 https://api.github.com/repos/luanti-org/luanti/releases/latest | jq -r .tag_name 2>/dev/null || true)
          case "$V" in
            ""|null) V="5.17.0"; echo "WARN: latest-release lookup failed (API rate limit?); falling back to pinned $V" ;;
          esac
          echo "LUANTI_VERSION=$V" >> "$GITHUB_ENV"
          echo "Engine version: $V"
      - name: Fetch engine (arm64 + x86_64) + embed game
        run: |
          set -e
          WORK=$(mktemp -d)
          mkdir -p "$WORK/mac"
          for ARCH in arm64 x86_64; do
            curl -sL --retry 5 --retry-all-errors --retry-delay 3 -o "$WORK/mac-$ARCH.zip" "https://github.com/luanti-org/luanti/releases/download/${LUANTI_VERSION}/luanti_${LUANTI_VERSION}_macos12.3_${ARCH}.zip"
            unzip -q "$WORK/mac-$ARCH.zip" -d "$WORK/mac/SystemLoot-macOS-$ARCH" -x "__MACOSX/*"
            APP=$(find "$WORK/mac/SystemLoot-macOS-$ARCH" -maxdepth 3 -name "*.app" -not -path "*__MACOSX*" | head -1)
            [ -n "$APP" ] || { echo "no .app found in mac-$ARCH.zip"; exit 1; }
            RES="$APP/Contents/Resources"
            mkdir -p "$RES/games/$GAME_ID"
            rsync -a --exclude=.git --exclude=.github ./ "$RES/games/$GAME_ID/"
          done
          cp -r "$WORK/mac" mac
          ls -la mac/
      - name: Install butler
        run: |
          curl -sL --retry 5 --retry-all-errors --retry-delay 3 -o butler.zip https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip
          unzip -q butler.zip
          chmod +x linux-amd64/butler
          ./linux-amd64/butler -V
      - name: Push to itch (osx)
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: ./linux-amd64/butler push mac "$ITCH_TARGET:osx" --userversion "${LUANTI_VERSION}-${GITHUB_SHA::7}"

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve latest Luanti release
        run: |
          V=$(curl -s --retry 4 --retry-all-errors --retry-delay 5 https://api.github.com/repos/luanti-org/luanti/releases/latest | jq -r .tag_name 2>/dev/null || true)
          case "$V" in
            ""|null) V="5.17.0"; echo "WARN: latest-release lookup failed (API rate limit?); falling back to pinned $V" ;;
          esac
          echo "LUANTI_VERSION=$V" >> "$GITHUB_ENV"
      - name: Install engine
        run: |
          sudo apt-get update
          sudo apt-get install -y luanti || sudo apt-get install -y minetest
      - name: Build portable bundle (engine + share + libs + game + launcher)
        run: |
          set -e
          # Resolve the real binary (some distros ship a shell wrapper).
          BIN=""
          for cand in /usr/libexec/luanti/luanti /usr/libexec/minetest/minetest; do
            [ -x "$cand" ] && BIN="$cand" && break
          done
          if [ -z "$BIN" ]; then
            W=$(command -v luanti || command -v minetest || true)
            if [ -n "$W" ]; then
              if file "$W" | grep -q "ELF"; then
                BIN="$W"
              else
                BIN=$(sed -nE 's#.*exec[[:space:]]+([^[:space:]]+).*#\1#p' "$W" | tail -1)
              fi
            fi
          fi
          [ -x "$BIN" ] || { echo "engine binary not found"; exit 1; }

          # Data dir detection across distro layouts — asserted loudly.
          # (The 5.17.0-81d26bb tarball shipped WITHOUT builtin/textures/
          # fonts because this detection failed silently on the runner.)
          SHARE=""
          for c in /usr/share/luanti /usr/share/minetest /usr/share/games/luanti /usr/share/games/minetest; do
            [ -f "$c/builtin/init.lua" ] && SHARE="$c" && break
          done
          if [ -z "$SHARE" ]; then
            for pkg in luanti minetest; do
              SHARE=$(dpkg -L "$pkg" 2>/dev/null | grep -E '/builtin$' | head -1 || true)
              [ -n "$SHARE" ] && break
            done
          fi
          [ -n "$SHARE" ] && [ -f "$SHARE/builtin/init.lua" ] || { echo "engine data dir (builtin/) not found"; exit 1; }
          echo "engine data: $SHARE"

          WORK=$(mktemp -d)
          bundle="$WORK/bundle"
          mkdir -p "$bundle/bin" "$bundle/lib" "$bundle/games/SystemTest"
          cp "$BIN" "$bundle/bin/luanti"
          for d in builtin client fonts textures locale; do
            if [ -d "$SHARE/$d" ]; then cp -r "$SHARE/$d" "$bundle/$d"; else echo "WARN: $SHARE/$d missing"; fi
          done
          [ -f "$bundle/builtin/init.lua" ]  || { echo "bundle missing builtin/"; exit 1; }
          [ -d "$bundle/textures/base" ]     || { echo "bundle missing textures/base/"; exit 1; }
          [ -d "$bundle/fonts" ]             || { echo "bundle missing fonts/"; exit 1; }

          rsync -a --exclude=.git --exclude=.github ./ "$bundle/games/SystemTest/"

          # Bundle NON-glibc dependencies only. Bundling the build distro's
          # glibc/ld crashes foreign distros (observed: undefined symbol
          # __nptl_change_stack_perm on Debian 13 glibc 2.41 vs bundled 2.39).
          ldd "$BIN" | awk '{print $3}' | grep -v '^$' | sort -u | while read -r so; do
            base=$(basename "$so")
            case "$base" in
              linux-vdso*|ld-linux*|ld-*.so|libc.so*|libm.so*|libmvec*|libpthread*|libdl*|librt*|libresolv*|libnss_*|libnsl*|libanl*|libBrokenLocale*|libthread_db*) continue ;;
            esac
            cp -n "$so" "$bundle/lib/" 2>/dev/null || true
          done

          cat > "$bundle/run-game.sh" <<'EOF'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$DIR/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          # Guarantee game discovery even on machines where a system
          # minetest/luanti share dir exists (engine prefers its compiled
          # STATIC_SHAREDIR over the bundled ../builtin in that case, but
          # MINETEST_SUBGAME_PATH is always honored for games).
          export MINETEST_SUBGAME_PATH="$DIR/games${MINETEST_SUBGAME_PATH:+:$MINETEST_SUBGAME_PATH}"
          # SystemTest is the product: default the engine to it
          # (default_game stays 'minetest' otherwise; extra args can override).
          exec "$DIR/bin/luanti" --gameid SystemTest "$@"
          EOF
          sed -i 's/^          //' "$bundle/run-game.sh"
          chmod +x "$bundle/run-game.sh" "$bundle/bin/luanti"

          # REAL smoke: --version exits before loading builtin/ (that weak
          # check let the broken tarball ship once). Boot a headless server
          # with the game and require both engine-ready and sl_modebase.
          "$bundle/run-game.sh" --version
          SMOKE_WORLD="$WORK/smokeworld"
          mkdir -p "$SMOKE_WORLD"
          printf 'gameid = SystemTest\nbackend = sqlite3\nmg_name = singlenode\n' > "$SMOKE_WORLD/world.mt"
          # Hide system share dirs so the smoke run reproduces a CLEAN
          # machine (engine falls back to the bundled ../builtin instead of
          # the compiled STATIC_SHAREDIR=/usr/share/games/minetest).
          for sysdir in /usr/share/games/minetest /usr/share/minetest /usr/share/luanti /usr/share/games/luanti; do
            [ -d "$sysdir" ] && sudo mv "$sysdir" "$sysdir.smoke-hidden" || true
          done
          timeout -s INT 30 "$bundle/run-game.sh" --server --world "$SMOKE_WORLD" > "$WORK/smoke.log" 2>&1 || true
          for sysdir in /usr/share/games/minetest /usr/share/minetest /usr/share/luanti /usr/share/games/luanti; do
            [ -d "$sysdir.smoke-hidden" ] && sudo mv "$sysdir.smoke-hidden" "$sysdir" || true
          done
          grep -qE "Server for gameid|listening" "$WORK/smoke.log" || { echo "server smoke FAILED:"; tail -30 "$WORK/smoke.log"; exit 1; }
          grep -q "Loaded core PvP game mode" "$WORK/smoke.log" || { echo "sl_modebase did not load:"; tail -30 "$WORK/smoke.log"; exit 1; }
          echo "server smoke OK: engine + SystemTest + sl_modebase boot from the bundle"
          tar czf SystemLoot-Linux.tar.gz -C "$bundle" .
          ls -la SystemLoot-Linux.tar.gz
      - name: Install butler
        run: |
          curl -sL --retry 5 --retry-all-errors --retry-delay 3 -o butler.zip https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip
          unzip -q butler.zip
          chmod +x linux-amd64/butler
          ./linux-amd64/butler -V
      - name: Push to itch (linux)
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: ./linux-amd64/butler push SystemLoot-Linux.tar.gz "$ITCH_TARGET:linux" --userversion "${LUANTI_VERSION}-${GITHUB_SHA::7}"

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Resolve latest Luanti release
        run: |
          V=$(curl -s --retry 4 --retry-all-errors --retry-delay 5 https://api.github.com/repos/luanti-org/luanti/releases/latest | jq -r .tag_name 2>/dev/null || true)
          case "$V" in
            ""|null) V="5.17.0"; echo "WARN: latest-release lookup failed (API rate limit?); falling back to pinned $V" ;;
          esac
          echo "LUANTI_VERSION=$V" >> "$GITHUB_ENV"
          echo "Engine version: $V"
      - name: Install APK toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y apktool aapt apksigner zipalign default-jre-headless python3-pil
      - name: Build SystemLoot-branded APKs (one per ABI)
        run: |
          set -e
          WORK=$(mktemp -d)
          # Outputs MUST live outside the checkout: game_dir is ".", so any
          # artifact written into the checkout gets injected into the next
          # ABI's assets.zip (that was the 25/50/102 MB matryoshka).
          # $RUNNER_TEMP persists across steps within this job.
          OUT="$RUNNER_TEMP/apks"
          mkdir -p "$OUT"
          keytool -genkeypair -keystore "$WORK/debug.keystore" -storepass android \
            -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            curl -sL --retry 5 --retry-all-errors --retry-delay 3 -o "$WORK/base-$ABI.apk" \
              "https://github.com/luanti-org/luanti/releases/download/${LUANTI_VERSION}/luanti-${LUANTI_VERSION}-${ABI}.apk"
            bash tools/build_apk.sh "$WORK/base-$ABI.apk" . "$WORK/debug.keystore" "$OUT/SystemLoot-$ABI.apk"
          done
          ls -la "$OUT"
      - name: Install butler
        run: |
          curl -sL --retry 5 --retry-all-errors --retry-delay 3 -o butler.zip https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip
          unzip -q butler.zip
          chmod +x linux-amd64/butler
          ./linux-amd64/butler -V
      - name: Push to itch (one channel per ABI = separate downloads)
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: |
          ls -la "$RUNNER_TEMP"/../ 2>/dev/null | head -2 || true
          for f in "$RUNNER_TEMP"/tmp.*/apks/SystemLoot-*.apk; do echo "found: $f"; done | head -3 || true
          ls -la "$RUNNER_TEMP/apks"
          ./linux-amd64/butler push "$RUNNER_TEMP/apks/SystemLoot-arm64-v8a.apk"    "$ITCH_TARGET:android-arm64-v8a"    --userversion "${LUANTI_VERSION}-${GITHUB_SHA::7}"
          ./linux-amd64/butler push "$RUNNER_TEMP/apks/SystemLoot-armeabi-v7a.apk"  "$ITCH_TARGET:android-armeabi-v7a"  --userversion "${LUANTI_VERSION}-${GITHUB_SHA::7}"
          ./linux-amd64/butler push "$RUNNER_TEMP/apks/SystemLoot-x86_64.apk"       "$ITCH_TARGET:android-x86_64"       --userversion "${LUANTI_VERSION}-${GITHUB_SHA::7}"

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24   # luanti-wasm's install_emsdk.sh requires Node >= 24.18
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake tclsh zstd
      - name: Build the Luanti WASM client (paradust7/luanti-wasm)
        run: |
          set -e
          # Clone OUTSIDE the checkout — rsyncing the workspace into the
          # game dir would otherwise recurse into the build tree
          # (gotcha ledger #1 — do not repeat it).
          git clone --depth 1 https://github.com/paradust7/luanti-wasm "$RUNNER_TEMP/luanti-wasm"
          cd "$RUNNER_TEMP/luanti-wasm"
          ./build_all.sh   # emsdk auto-downloads; ~30-45 min
      - name: Embed SystemTest into the virtual FS + repack www
        run: |
          set -e
          cd "$RUNNER_TEMP/luanti-wasm"
          mkdir -p build/fsroot/luanti/games/SystemTest
          rsync -a --exclude=.git --exclude=.github "$GITHUB_WORKSPACE/" build/fsroot/luanti/games/SystemTest/
          # This game is the product: drop the bundled minetest_game so the
          # client ships SystemTest only (owner directive).
          rm -rf build/fsroot/luanti/games/minetest_game
          # CRITICAL: base.pack IS build/fsroot.tar.zst (built by
          # build_fsroot.sh during build_all.sh). After mutating fsroot the
          # tarball MUST be regenerated or the packs keep the OLD fsroot
          # (minetest_game in, SystemTest out) — that bug shipped once.
          # Pack format: UNCOMPRESSED tar. The CI-built wasm's libarchive
          # rejects zstd at runtime ("emloop_install_pack failed: zstd not
          # supported") despite --with-zstd builds — an upstream wasm
          # toolchain integration issue. libarchive's raw-tar reader is
          # unconditional, so base.pack ships as plain tar (filename keeps
          # the .zst suffix build_www.sh expects; detection is by content).
          (cd build/fsroot && tar cf ../fsroot.tar .)
          rm -f build/fsroot.tar.zst
          mv build/fsroot.tar build/fsroot.tar.zst
          # Assert the virtual FS actually contains the product.
          tar tf build/fsroot.tar.zst > /tmp/fsroot_list.txt
          grep -q "games/SystemTest/game.conf" /tmp/fsroot_list.txt || { echo "SystemTest missing from fsroot pack"; exit 1; }
          grep -q "games/minetest_game/" /tmp/fsroot_list.txt && { echo "minetest_game still in fsroot pack"; exit 1; }
          echo "fsroot pack verified: SystemTest in, minetest_game out"
          ./build_www.sh
          ls -la www/
      - name: Default the client to SystemTest + add cross-origin isolation
        run: |
          set -e
          cd "$RUNNER_TEMP/luanti-wasm/www"
          # 1) Default game: launcher defaults gameid to '' (menu shows all
          #    games; MTG used to win). Hard-default it to SystemTest; the
          #    ?gameid= URL param still overrides.
          find . -name launcher.js -exec sed -i "s/this.gameid = '';/this.gameid = 'SystemTest';/" {} +
          find . -name launcher.js | xargs grep -l "this.gameid = 'SystemTest';" >/dev/null
          echo "launcher defaulted to SystemTest"
          # 2) coi-serviceworker: client-side COOP/COEP. NOTE: inside the
          #    itch embed (html.itch.zone iframe) a service worker cannot
          #    isolate the TOP-LEVEL page — on itch the "SharedArrayBuffer
          #    support" embed-option checkbox is still required. On
          #    GitHub Pages (top-level) this alone provides isolation.
          curl -sL --retry 5 --retry-all-errors --retry-delay 3 -o coi-serviceworker.min.js \
            https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js
          sed -i '0,/<head[^>]*>/s//&<script src="coi-serviceworker.min.js"><\/script>/' index.html
          grep -q coi-serviceworker index.html && echo "coi-serviceworker wired into index.html"
      - name: Install butler
        run: |
          curl -sL --retry 5 --retry-all-errors --retry-delay 3 -o butler.zip https://github.com/itchio/butler/releases/latest/download/butler-linux-amd64.zip
          unzip -q butler.zip
          chmod +x linux-amd64/butler
          ./linux-amd64/butler -V
      - name: Push to itch (web)
        env:
          BUTLER_API_KEY: ${{ secrets.ITCH_API_KEY }}
        run: ./linux-amd64/butler push "$RUNNER_TEMP/luanti-wasm/www" "$ITCH_TARGET:web" --userversion "wasm-${GITHUB_SHA::7}"
      - name: Upload www artifact (Pages source + diagnosis)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: www-wasm
          path: ${{ runner.temp }}/luanti-wasm/www

  web-pages:
    runs-on: ubuntu-latest
    needs: [web]
    permissions:
      contents: write   # push the gh-pages branch
    steps:
      - name: Download built www
        uses: actions/download-artifact@v5
        with:
          name: www-wasm
          path: www
      - name: Publish to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          force_orphan: true
          # GitHub Pages serves the page top-level, so the bundled
          # coi-serviceworker can actually provide COOP/COEP there
          # (unlike the itch embed iframe) — this is the web build that
          # boots without any manual checkbox.
