name: soak

# Merge gate for the multi-agent workflow described in AGENT_PARALLEL_PLAN.md:
# every push / pull request must pass the stub smoke test and the live-engine
# soak test (simulated AI players, bug harvest, balance telemetry).

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Install Lua + Luanti engine
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.1 luajit
          # Distro package first; fall back to the minetestdevs PPA.
          sudo apt-get install -y minetest \
            || sudo apt-get install -y luanti \
            || { sudo add-apt-repository -y ppa:minetestdevs/stable \
                 && sudo apt-get update \
                 && sudo apt-get install -y minetest; }

      - name: Syntax check all mod Lua files (LuaJIT - the engine's parser)
        run: |
          # LuaJIT is the actual Luanti runtime, so goto and other 5.2+
          # extensions are legal game code. The old luac5.1 gate wrongly
          # rejected them; do not reintroduce a stricter-than-engine check.
          fail=0
          for f in $(find mods -name '*.lua'); do
            luajit -bl "$f" >/dev/null || { echo "SYNTAX FAIL: $f"; fail=1; }
          done
          exit $fail

      - name: Headless stub smoke test
        run: luajit tests/smoke_test.lua

      - name: Simulacrum Strand stub suite
        run: luajit tests/strand_test.lua

      - name: Bot roster stub suite (pool validation, apply_pool reconciliation, /sl_bots end-to-end)
        run: luajit tests/bot_pool_test.lua

      - name: Scoring stub suite (K/D-weighted kills, objectives, end-match bonuses, banking split)
        run: luajit tests/scoring_test.lua

      - name: sl_weapons stub suite (fire pipeline, corpses, pads, turrets, lash, fabricator, tournament)
        run: luajit tests/weapons_test.lua

      - name: MM essence stub suite (provenance, pricing, pool, hazard)
        run: luajit tests/essence_test.lua

      - name: Weapons stub turbo soak (40 matches, kill-share + lash gates)
        run: luajit tests/soak_stub_turbo.lua

      - name: Live-engine soak test (AI players, 3 matches)
        run: |
          python3 tests/soak/run_soak.py \
            --turbo --matches 3 --match-duration 60 \
            --seed ${{ github.run_number }} \
            --timeout 900 --report soak_report.json --keep-world

      - name: Upload soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-report-run${{ github.run_number }}
          path: |
            soak_report.json
            /tmp/sl_soak_*/server_console.log
          if-no-files-found: ignore
