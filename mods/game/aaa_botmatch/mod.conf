name = aaa_botmatch
description = Headless soak-test harness - simulated AI players drive real matches on a live Luanti server, harvesting bugs and balance telemetry into botmatch_stats.json. Inert unless sl_botmatch.enabled = true. Two bot kinds are exposed: stub bots (no engine body, headless Lua state, straight-line step toward target) when only enabled is set, and mob bots (engine entity with A* pathfinding + GLB model + in-world nametag) when mob_mode is also true. The aaa_ prefix guarantees load-before-all so callback registration can be intercepted.
